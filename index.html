<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>دعوة عقد قران</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="stage">
  <div class="card-wrap" id="cardWrap">

    <!-- ================= COVER (closed invitation) ================= -->
    <div class="cover panel" id="coverBtn" role="button" tabindex="0" aria-label="اضغط لفتح الدعوة">
      <div class="corner tl"><svg viewBox="0 0 66 66"><path d="M2 2 C 20 2, 30 2, 30 20 C 30 2, 46 2, 62 2" fill="none" stroke="#c8a34c" stroke-width="1.4"/><path d="M2 2 C 2 20, 2 30, 20 30 C 2 30, 2 46, 2 62" fill="none" stroke="#c8a34c" stroke-width="1.4"/><circle cx="14" cy="14" r="3.4" fill="#6d2438"/><path d="M14 14 C 8 8, 4 10, 6 16 C 8 10, 14 8, 14 14 Z" fill="#7c8a6a"/></svg></div>
      <div class="corner tr"><svg viewBox="0 0 66 66"><path d="M2 2 C 20 2, 30 2, 30 20 C 30 2, 46 2, 62 2" fill="none" stroke="#c8a34c" stroke-width="1.4"/><path d="M2 2 C 2 20, 2 30, 20 30 C 2 30, 2 46, 2 62" fill="none" stroke="#c8a34c" stroke-width="1.4"/><circle cx="14" cy="14" r="3.4" fill="#6d2438"/><path d="M14 14 C 8 8, 4 10, 6 16 C 8 10, 14 8, 14 14 Z" fill="#7c8a6a"/></svg></div>
      <div class="corner bl"><svg viewBox="0 0 66 66"><path d="M2 2 C 20 2, 30 2, 30 20 C 30 2, 46 2, 62 2" fill="none" stroke="#c8a34c" stroke-width="1.4"/><path d="M2 2 C 2 20, 2 30, 20 30 C 2 30, 2 46, 2 62" fill="none" stroke="#c8a34c" stroke-width="1.4"/><circle cx="14" cy="14" r="3.4" fill="#6d2438"/><path d="M14 14 C 8 8, 4 10, 6 16 C 8 10, 14 8, 14 14 Z" fill="#7c8a6a"/></svg></div>
      <div class="corner br"><svg viewBox="0 0 66 66"><path d="M2 2 C 20 2, 30 2, 30 20 C 30 2, 46 2, 62 2" fill="none" stroke="#c8a34c" stroke-width="1.4"/><path d="M2 2 C 2 20, 2 30, 20 30 C 2 30, 2 46, 2 62" fill="none" stroke="#c8a34c" stroke-width="1.4"/><circle cx="14" cy="14" r="3.4" fill="#6d2438"/><path d="M14 14 C 8 8, 4 10, 6 16 C 8 10, 14 8, 14 14 Z" fill="#7c8a6a"/></svg></div>

      <div>
        <div class="bismillah">بسم الله الرحمن الرحيم</div>
        <div class="cover-eyebrow">دعوة حفل عقد قران</div>
        <div class="cover-title" id="coverTitle">— &amp; —</div>
      </div>

      <div class="seal-wrap">
        <div class="seal-pulse"></div>
        <svg viewBox="0 0 120 120">
          <g class="seal-half left">
            <path d="M60 20 A40 40 0 0 0 60 100 Z" fill="#6d2438"/>
          </g>
          <g class="seal-half right">
            <path d="M60 20 A40 40 0 0 1 60 100 Z" fill="#6d2438"/>
          </g>
          <circle cx="60" cy="60" r="40" fill="none" stroke="#481621" stroke-width="1.5" opacity="0.6"/>
        </svg>
        <div class="seal-emblem" id="sealEmblem" aria-hidden="true"></div>
      </div>

      <div class="tap-hint">
        اضغطوا لفتح الدعوة
        <span>Tap to open the invitation</span>
      </div>
    </div>

    <!-- ================= CONTENT (opened invitation) ================= -->
    <div class="content panel">
      <br/><br/>
      <p class="families-line" id="familiesLine"></p>

      <div class="divider">
        <svg viewBox="0 0 70 16"><path d="M0 8 H26" stroke="#c8a34c" stroke-width="1"/><path d="M70 8 H44" stroke="#c8a34c" stroke-width="1"/><path d="M35 8 l4 -5 l4 5 l-4 5 Z" fill="#6d2438"/><circle cx="35" cy="8" r="2" fill="#e6ca86"/></svg>
      </div>

      <div class="names">
        <span class="name" id="brideName">العروس</span>
      </div>

      <div class="details">
        <div class="detail-row big" id="dateDisplay">—</div>
        <div class="detail-row" id="timeDisplay">—</div>
        <div class="detail-row">
        <a class="map-link" id="mapLink" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span class="venue-name" id="venueName">—</span> — <span id="venueCity">—</span>
        </a>
        </div>
      </div>

      <div class="countdown-wrap">
        <div class="countdown-label">متبقٍ على الفرح</div>
        <div class="countdown" id="countdown">
          <div class="count-box"><div class="count-num" id="cd-days">00</div><div class="count-lbl">يوم</div></div>
          <div class="count-box"><div class="count-num" id="cd-hours">00</div><div class="count-lbl">ساعة</div></div>
          <div class="count-box"><div class="count-num" id="cd-mins">00</div><div class="count-lbl">دقيقة</div></div>
          <div class="count-box"><div class="count-num" id="cd-secs">00</div><div class="count-lbl">ثانية</div></div>
        </div>
      </div>

      <div class="footer-line">بحضوركم يكتمل فرحنا 🌹</div>

  </div>

  <audio id="bgMusic" loop preload="auto">
    <!-- Replace src below with your own uploaded track's path/URL -->
    <source src="assets/music/Thousand_years.mp3" type="audio/mp3">
  </audio>

  <button class="sound-toggle" id="soundToggle" aria-label="كتم/تشغيل الموسيقى">
    <svg id="soundIcon" viewBox="0 0 24 24" fill="black" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6 9H2v6h4l5 4V5z"/>
      <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
      <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
    </svg>
  </button>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
